name: Build release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}

      - name: Install GNU Make on Windows
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils dpkg-dev make

      - name: Set up Poetry environment
        run: |
          python -m pip install poetry==1.7.0
          make setup

      - name: Run tests
        run: make test

      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: make build-exe

      - name: Build Linux package
        if: runner.os == 'Linux'
        run: |
          make build-deb
          sudo dpkg --install dist/pc2mqtt-linux-amd64.deb
          /usr/bin/pc2mqtt --help

      - name: Attach asset to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET_PLATFORM: ${{ matrix.platform }}
          ASSET_ARCH: ${{ matrix.arch }}
        run: |
          if [ "$ASSET_PLATFORM" = windows ]; then
            asset="dist/pc2mqtt-windows-$ASSET_ARCH.exe"
          else
            asset="dist/pc2mqtt-linux-amd64.deb"
          fi
          gh release upload "$RELEASE_TAG" "$asset" --clobber
