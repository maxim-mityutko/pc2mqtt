name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python: ['3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install GNU Make on Windows
        if: runner.os == 'Windows'
        run: choco install make --yes --no-progress

      - name: Set up Poetry environment
        run: |
          python -m pip install poetry==2.4.1
          make setup

      - name: Run tests
        run: make test
